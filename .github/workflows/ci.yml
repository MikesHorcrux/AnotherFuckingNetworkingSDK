name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift 6
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Debug tests with strict concurrency
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Release tests with strict concurrency
        run: swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Forward Swift 6 isolation build
        run: |
          swift build \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -enable-upcoming-feature \
            -Xswiftc NonisolatedNonsendingByDefault
      - name: Parseable library-evolution interfaces
        run: |
          swift build -c release \
            --enable-parseable-module-interfaces \
            -Xswiftc -enable-library-evolution \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
      - name: iOS 15 product builds
        run: |
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDK \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDKTesting \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
      - name: macOS 12 product builds
        run: |
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDK \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDKTesting \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
      - name: iOS simulator tests (when installed)
        shell: bash
        run: |
          set -euo pipefail
          destinations="$(xcodebuild \
            -scheme AnotherFuckingNetworkingSDK-Package \
            -showdestinations 2>/dev/null || true)"
          simulator_id="$(printf '%s\n' "$destinations" | awk -F'id:' \
            '/platform:iOS Simulator, arch/ {
              split($2, values, ","); print values[1]; exit
            }' | tr -d '[:space:]')"
          if [[ -z "$simulator_id" ]]; then
            echo "Skipping iOS simulator tests: no simulator is installed."
            exit 0
          fi
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDK-Package \
            -destination "id=${simulator_id}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -skip-testing:AnotherFuckingNetworkingSDKTests/WebSocketLoopbackTests \
            test
      - name: Additional Apple platform product builds (when installed)
        shell: bash
        run: |
          set -euo pipefail
          build_platform() {
            local platform="$1"
            local label="$2"
            local destination="generic/platform=${platform}"
            if ! xcodebuild -quiet \
              -scheme AnotherFuckingNetworkingSDK \
              -destination "$destination" \
              -showBuildSettings >/dev/null 2>&1; then
              echo "Skipping ${label}: SDK/destination is not installed on this runner."
              return 0
            fi
            for scheme in AnotherFuckingNetworkingSDK AnotherFuckingNetworkingSDKTesting; do
              xcodebuild -quiet \
                -scheme "$scheme" \
                -destination "$destination" \
                -configuration Release \
                CODE_SIGNING_ALLOWED=NO \
                SWIFT_STRICT_CONCURRENCY=complete \
                SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
                BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
                build
            done
          }
          build_platform tvOS "tvOS 15"
          build_platform watchOS "watchOS 8"
          build_platform visionOS "visionOS 1"
      - name: Mac Catalyst product builds
        run: |
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDK \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
          xcodebuild -quiet \
            -scheme AnotherFuckingNetworkingSDKTesting \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
